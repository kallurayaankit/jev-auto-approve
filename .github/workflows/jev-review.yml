name: Jev PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Jev review
        uses: metalbear-co/jev-auto-approve@5c58e7b3a3c9977a7e646504190457773d1d87fa # v2.0.0
        with:
          jev-api-key: ${{ secrets.TYPESAFE_API_KEY }}
          approve-token: ${{ secrets.APPROVE_TOKEN }}
          confidence-threshold: '0.85'
          dry-run: true