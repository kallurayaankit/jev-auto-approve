steps:
  - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    with:
      fetch-depth: 0
  - uses: metalbear-co/jev-auto-approve@<COMMIT_SHA_FOR_V1> # v1
    with:
      jev-api-key: ${{ secrets.TYPESAFE_API_KEY }}
      confidence-threshold: '0.85'
      approve-token: ''
