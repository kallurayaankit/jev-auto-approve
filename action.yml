name: 'Jev auto-approve'
description: 'Approve a pull request when the Jev API returns a verdict of approve above a confidence threshold.'
author: 'MetalBear'

branding:
  icon: 'check-circle'
  color: 'purple'

inputs:
  jev-api-key:
    description: 'TypeSafe API key used to call the Jev API. Pass a secret, never a literal.'
    required: true
  approve-token:
    description: >-
      Token that submits the approval. Use the PAT of the bot account that should appear as the
      reviewer (e.g. cubby-mb), or an installation token minted for a GitHub App. The default
      GITHUB_TOKEN can approve, but the review is attributed to github-actions[bot] and does not
      satisfy "required approvals" on protected branches.
    required: true
  confidence-threshold:
    description: 'Minimum Jev confidence (0-1) required to approve. Below this the run skips.'
    required: false
    default: '0.9'
  prompt:
    description: >-
      Extra instructions handed to Jev describing what this repository considers approvable.
      Prepended to the verdict question. Leave empty to use the built-in review rubric.
    required: false
    default: ''
  approver:
    description: >-
      Login expected to own approve-token (e.g. cubby-mb). When set, the identity behind the token
      is verified before any review is submitted and the run fails on a mismatch. Leave empty to
      skip the check (required for GitHub App installation tokens, which have no user identity).
    required: false
    default: ''
  model:
    description: 'Jev model identifier.'
    required: false
    default: 'jev-latest'
  pr-number:
    description: 'Pull request to review. Defaults to the PR carried by the triggering event.'
    required: false
    default: ''
  github-token:
    description: 'Token used to read the pull request and its diff.'
    required: false
    default: ${{ github.token }}
  dry-run:
    description: 'Evaluate and report the verdict without submitting a review.'
    required: false
    default: 'false'
  comment-on-skip:
    description: 'Post a comment explaining why the PR was not approved.'
    required: false
    default: 'true'
  max-diff-bytes:
    description: 'Diff is truncated to this many bytes before being sent to Jev.'
    required: false
    default: '200000'

outputs:
  approved:
    description: '"true" when an approving review was submitted.'
  verdict:
    description: 'The choice Jev returned: approve or request_changes.'
  confidence:
    description: 'Jev confidence for the verdict, 0-1.'
  approve-probability:
    description: 'Probability Jev assigned to the approve option, 0-1.'
  probabilities:
    description: 'Full probability map from Jev, as JSON.'
  pr-number:
    description: 'Pull request that was evaluated.'
  reason:
    description: 'Human-readable explanation of the outcome.'

runs:
  using: 'node20'
  main: 'src/main.mjs'
