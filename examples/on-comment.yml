# Approve on demand: someone with write access comments `/jev-approve` on a pull request.
#
# issue_comment always runs from the default branch with repository secrets available, which is why
# this is the safest trigger for an approval bot — fork PRs cannot swap the workflow out from under
# you the way pull_request_target lets them swap the checked-out code.
name: Jev auto-approve on comment

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-approve:
    # Only on pull requests, only for the command, only from someone who can already merge.
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/jev-approve') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge the command
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            });

      # Pin to a commit in a real repository: a release can change the default rubric.
      - id: jev
        uses: metalbear-co/jev-auto-approve@v1
        with:
          jev-api-key: ${{ secrets.TYPESAFE_API_KEY }}
          approve-token: ${{ secrets.APPROVE_TOKEN }}
          approver: your-review-bot
          confidence-threshold: '0.92'
          # Leaving `questions` unset asks the three defaults. Naming them replaces the set, so
          # this one adds a repository-specific question and keeps the two it cares about.
          questions: |
            {
              "tests_sufficient": {
                "instructions": "Is the behaviour this pull request changes covered by testing?",
                "approve_when": "yes",
                "yes": "Yes: tests were added or updated that exercise what changed, or the pull request records manual testing that does.",
                "no": "No: behaviour changed and nothing shown here exercises it."
              },
              "touches_privileged_automation": {
                "instructions": "Does this pull request change anything that runs with write-capable credentials?",
                "approve_when": "no",
                "yes": "Yes: it changes CI, release, publishing, signing or credential configuration.",
                "no": "No: it leaves that configuration alone."
              },
              "needs_human_review": {
                "instructions": "Does this pull request require a human reviewer before it can be merged?",
                "approve_when": "no",
                "yes": "Yes: this pull request should be read by a human before it is merged.",
                "no": "No: this pull request needs no human intervention. It can be approved as it stands."
              }
            }

      - name: Report
        env:
          APPROVED: ${{ steps.jev.outputs.approved }}
          CONFIDENCE: ${{ steps.jev.outputs.confidence }}
        run: echo "approved=$APPROVED confidence=$CONFIDENCE"
