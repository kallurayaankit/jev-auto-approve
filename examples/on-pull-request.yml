# Approve automatically on every push to a pull request, scoped to a trusted set of authors.
#
# `pull_request` does not expose secrets to runs from forks, so this only ever fires on branches in
# the repository itself. Keep it that way: giving fork PRs a path to an approval token is how an
# auto-approver turns into a supply-chain hole.
name: Jev auto-approve

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-approve:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      contains(fromJSON('["dependabot[bot]", "renovate[bot]"]'), github.event.pull_request.user.login)
    runs-on: ubuntu-latest
    steps:
      # Pin to a commit in a real repository: a release can change the default rubric.
      - uses: metalbear-co/jev-auto-approve@v1
        with:
          jev-api-key: ${{ secrets.TYPESAFE_API_KEY }}
          approve-token: ${{ secrets.APPROVE_TOKEN }}
          approver: your-review-bot
          confidence-threshold: '0.95'
          questions: |
            {
              "routine_bump": {
                "instructions": "Is this a routine dependency bump?",
                "approve_when": "yes",
                "yes": "Yes: a patch or minor version bump touching nothing beyond the manifest and lockfile.",
                "no": "No: it is a major bump, or it changes something besides the manifest and lockfile."
              },
              "needs_human_review": {
                "instructions": "Does this pull request require a human reviewer before it can be merged?",
                "approve_when": "no",
                "yes": "Yes: this pull request should be read by a human before it is merged.",
                "no": "No: this pull request needs no human intervention. It can be approved as it stands."
              }
            }
